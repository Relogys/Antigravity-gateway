name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Audit docs & repo for leaked secrets
        run: node scripts/audit-secrets.mjs

      - name: Classify changes
        id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$head" || true)"
          echo "Changed files:"
          echo "$changed"
          if [ -z "$changed" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Skip heavy OS/Node/Docker builds when ONLY Markdown docs or LICENSE changed.
          # Skipped jobs still satisfy GitHub Branch Ruleset required status checks,
          # while Security's secret audit continues scanning docs changes.
          if echo "$changed" | grep -Evq '^(README\.md|CHANGELOG\.md|SECURITY\.md|LICENSE|docs/.*\.md|.*\.md)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change detected; skipping heavy build matrix."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Node ${{ matrix.node }}
    needs: changes
    # No job-level `if` here: a skipped matrix job reports as the unexpanded
    # "Node ${{ matrix.node }}", so the required "Node 24" check would never
    # report. The job runs for a few seconds and skips its steps instead.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Docs-only change, nothing to verify
        if: needs.changes.outputs.code != 'true'
        run: echo "Docs-only change; skipping build and tests."

      - name: Checkout
        if: needs.changes.outputs.code == 'true'
        uses: actions/checkout@v7

      - name: Set up pnpm
        if: needs.changes.outputs.code == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: needs.changes.outputs.code == 'true'
        run: pnpm typecheck

      - name: Build
        if: needs.changes.outputs.code == 'true'
        run: pnpm build

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: pnpm test

      - name: Audit for leaked secrets
        if: needs.changes.outputs.code == 'true'
        run: pnpm audit:secrets

  verify-windows:
    name: Windows / Node 24
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit for leaked secrets
        run: pnpm audit:secrets

  verify-macos:
    name: macOS (Apple Silicon) / Node 24
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Audit for leaked secrets
        run: pnpm audit:secrets

  docker-build:
    name: Docker image build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: antigravity-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max